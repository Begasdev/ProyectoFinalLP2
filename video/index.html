<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <style>
    :root {
      --ground: #f5f5f7;
      --ink: #1d1d1f;
      --blue: #0071e3;
      --muted: #6e6e73;
      --font-display: sans-serif;
    }
    html, body {
      margin: 0; width: 1920px; height: 1080px; overflow: hidden;
      background: var(--ground); font-family: var(--font-display);
    }
    #root { width: 100%; height: 100%; position: relative; }
    .title-xl { font-size: 96px; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); }
    .title-lg { font-size: 64px; font-weight: 700; color: var(--ink); }
    .text-lg { font-size: 36px; color: var(--muted); }
  </style>
</head>
<body>
  <script src="datos.js"></script>
  <div id="root" data-composition-id="main" data-start="0" data-duration="65" data-width="1920" data-height="1080">

    <!-- Escena 1: 0-5s -->
    <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0" data-duration="5" data-track-index="0"></div>

    <!-- Escena 2: 5-12s -->
    <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="5" data-duration="7" data-track-index="0"></div>

    <!-- Escena 3: 12-22s -->
    <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="12" data-duration="10" data-track-index="0"></div>

    <!-- Escena 4: 22-34s -->
    <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="22" data-duration="12" data-track-index="0"></div>

    <!-- Escena 5: 34-48s -->
    <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="34" data-duration="14" data-track-index="0"></div>

    <!-- Escena 6: 48-58s -->
    <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="48" data-duration="10" data-track-index="0"></div>

    <!-- Escena 7: 58-65s -->
    <div id="s7" data-composition-id="s7" data-composition-src="compositions/s7.html" data-start="58" data-duration="7" data-track-index="0"></div>

  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.fromTo("#s1-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.5);
    tl.fromTo("#s1-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.2);

    window.__timelines["main"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
