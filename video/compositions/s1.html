<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; background: #f5f5f7; font-family: sans-serif; }
    #s1 { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
    .title-xl { font-size: 96px; font-weight: 700; letter-spacing: -0.03em; color: #1d1d1f; }
    .text-lg { font-size: 36px; color: #6e6e73; }
  </style>
</head>
<body>
  <div id="s1" data-composition-id="s1" data-start="0" data-duration="5" data-width="1920" data-height="1080">
    <span style="font-size:120px;color:#0071e3;">🛒</span>
    <h1 class="title-xl" id="s1-title">ProyectoFinalLP2</h1>
    <p class="text-lg" id="s1-sub">Sistema web de inventario y punto de venta</p>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#s1-title", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.5);
    tl.fromTo("#s1-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.2);
    window.__timelines["s1"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
