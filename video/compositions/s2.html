<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; background: #f5f5f7; font-family: sans-serif; }
    #s2 { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; }
    .title-lg { font-size: 64px; font-weight: 700; color: #1d1d1f; }
    .card-apple { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 32px; display: flex; align-items: center; gap: 16px; max-width: 1200px; width: 100%; opacity: 0; transform: translateY(20px); }
  </style>
</head>
<body>
  <div id="s2" data-composition-id="s2" data-start="0" data-duration="7" data-width="1920" data-height="1080">
    <h1 class="title-lg">Objetivo del sistema</h1>
    <div style="display:flex;flex-direction:column;gap:24px;max-width:1200px;width:100%;">
      <div class="card-apple" id="s2-1"><span style="font-size:32px;color:#0071e3;">📦</span><span style="font-size:32px;">Controla productos, categorías y unidades de medida.</span></div>
      <div class="card-apple" id="s2-2"><span style="font-size:32px;color:#0071e3;">👥</span><span style="font-size:32px;">Gestiona clientes y proveedores en un solo lugar.</span></div>
      <div class="card-apple" id="s2-3"><span style="font-size:32px;color:#0071e3;">🔒</span><span style="font-size:32px;">Acceso por roles con seguridad BCrypt.</span></div>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#s2-1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1);
    tl.fromTo("#s2-2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2);
    tl.fromTo("#s2-3", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 3);
    window.__timelines["s2"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
