<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; background: #f5f5f7; font-family: sans-serif; }
    #s3 { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 60px; padding: 60px; }
    .title-lg { font-size: 64px; font-weight: 700; color: #1d1d1f; margin-bottom: 24px; }
    .mockup { width: 700px; background: #fff; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.12); overflow: hidden; transform: scale(0.9); opacity: 0; }
    .mockup-bar { background: #f0f0f5; padding: 12px 20px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .mockup-body { padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="s3" data-composition-id="s3" data-start="0" data-duration="10" data-width="1920" data-height="1080">
    <div class="mockup" id="mockup">
      <div class="mockup-bar">
        <span class="dot" style="background:#ff5f57;"></span>
        <span class="dot" style="background:#febc2e;"></span>
        <span class="dot" style="background:#28c840;"></span>
        <span style="margin-left:16px;color:#6e6e73;font-size:14px;">ProyectoFinalLP2 - Iniciar sesión</span>
      </div>
      <div class="mockup-body">
        <span style="font-size:48px;color:#0071e3;display:block;margin-bottom:16px;">🛒</span>
        <h3 style="margin-bottom:8px;">ProyectoFinalLP2</h3>
        <p style="color:#6e6e73;margin-bottom:24px;">Sistema de Gestión de Inventario</p>
        <div style="background:#f5f5f7;border-radius:8px;padding:12px;margin-bottom:12px;text-align:left;color:#6e6e73;">Usuario</div>
        <div style="background:#f5f5f7;border-radius:8px;padding:12px;margin-bottom:16px;text-align:left;color:#6e6e73;">Contraseña</div>
        <div style="background:#0071e3;color:#fff;border-radius:980px;padding:12px;font-weight:600;">Ingresar</div>
      </div>
    </div>
    <div style="max-width:600px;">
      <h1 class="title-lg" style="margin-bottom:24px;">Acceso seguro</h1>
      <ul style="list-style:none;padding:0;font-size:32px;line-height:2;">
        <li><span style="color:#0071e3;margin-right:16px;">👤</span>Roles: Administrador y Empleado.</li>
        <li><span style="color:#0071e3;margin-right:16px;">🔒</span>Contraseñas protegidas con BCrypt.</li>
        <li><span style="color:#0071e3;margin-right:16px;">🔑</span>Cambio de clave temporal al primer ingreso.</li>
      </ul>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#mockup", { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.8, ease: "power2.out" }, 0.5);
    window.__timelines["s3"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
