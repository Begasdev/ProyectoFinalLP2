<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; background: #f5f5f7; font-family: sans-serif; }
    #s4 { width: 100%; height: 100%; padding: 60px; display: flex; flex-direction: column; }
    .title-lg { font-size: 64px; font-weight: 700; color: #1d1d1f; margin-bottom: 32px; }
    .card-apple { background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 24px; text-align: center; }
  </style>
</head>
<body>
  <div id="s4" data-composition-id="s4" data-start="0" data-duration="12" data-width="1920" data-height="1080">
    <h1 class="title-lg">Dashboard</h1>
    <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:20px;margin-bottom:32px;">
      <div class="card-apple" id="d1"><span style="font-size:32px;color:#0071e3;">📏</span><h2 style="margin:8px 0 0;">6</h2><small style="color:#6e6e73;">Unidades</small></div>
      <div class="card-apple" id="d2"><span style="font-size:32px;color:#34c759;">🏷️</span><h2 style="margin:8px 0 0;">4</h2><small style="color:#6e6e73;">Categorías</small></div>
      <div class="card-apple" id="d3"><span style="font-size:32px;color:#ff9500;">📦</span><h2 style="margin:8px 0 0;">8</h2><small style="color:#6e6e73;">Productos</small></div>
      <div class="card-apple" id="d4"><span style="font-size:32px;color:#5ac8fa;">👥</span><h2 style="margin:8px 0 0;">3</h2><small style="color:#6e6e73;">Clientes</small></div>
      <div class="card-apple" id="d5"><span style="font-size:32px;color:#ff3b30;">🚚</span><h2 style="margin:8px 0 0;">3</h2><small style="color:#6e6e73;">Proveedores</small></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:32px;">
      <div class="card-apple" style="border:2px solid #ff9500;" id="d6"><span style="font-size:32px;color:#ff9500;">⚠️</span><h2 style="margin:8px 0 0;color:#ff9500;">2</h2><small style="color:#6e6e73;">Stock bajo</small></div>
      <div class="card-apple" id="d7"><span style="font-size:32px;color:#34c759;">💰</span><h2 style="margin:8px 0 0;">$42.50</h2><small style="color:#6e6e73;">Valor inventario</small></div>
      <div class="card-apple" id="d8"><span style="font-size:32px;color:#ff3b30;">🚫</span><h2 style="margin:8px 0 0;color:#ff3b30;">1</h2><small style="color:#6e6e73;">Agotados</small></div>
    </div>
    <div class="card-apple" style="flex:1;">
      <h3 style="margin-bottom:16px;font-size:24px;">Productos con menos stock</h3>
      <table style="width:100%;border-collapse:collapse;font-size:20px;">
        <thead><tr style="border-bottom:2px solid #0071e3;"><th style="text-align:left;padding:8px;">Código</th><th style="text-align:left;padding:8px;">Descripción</th><th style="text-align:right;padding:8px;">Cantidad</th></tr></thead>
        <tbody>
          <tr style="border-bottom:1px solid #eee;"><td style="padding:8px;font-family:Courier New;color:#6e6e73;">LIM-002</td><td style="padding:8px;">Jabón de baño</td><td style="padding:8px;text-align:right;"><span style="background:#ff3b30;color:#fff;padding:2px 8px;border-radius:980px;font-size:14px;">Agotado</span></td></tr>
          <tr style="border-bottom:1px solid #eee;"><td style="padding:8px;font-family:Courier New;color:#6e6e73;">LIM-001</td><td style="padding:8px;">Detergente 1L</td><td style="padding:8px;text-align:right;"><span style="background:#ff9500;color:#fff;padding:2px 8px;border-radius:980px;font-size:14px;">30</span></td></tr>
          <tr style="border-bottom:1px solid #eee;"><td style="padding:8px;font-family:Courier New;color:#6e6e73;">LAC-002</td><td style="padding:8px;">Yogurt natural 1L</td><td style="padding:8px;text-align:right;">40</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#d3", { scale: 1 }, { scale: 1.15, duration: 0.4, ease: "power2.out", yoyo: true, repeat: 1 }, 3);
    tl.fromTo("#d6", { scale: 1 }, { scale: 1.15, duration: 0.4, ease: "power2.out", yoyo: true, repeat: 1 }, 4);
    tl.fromTo("#d8", { scale: 1 }, { scale: 1.15, duration: 0.4, ease: "power2.out", yoyo: true, repeat: 1 }, 5);
    window.__timelines["s4"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
