<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1920px; height: 1080px; overflow: hidden; background: #f5f5f7; font-family: sans-serif; }
    #s7 { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; }
    .title-xl { font-size: 96px; font-weight: 700; letter-spacing: -0.03em; color: #1d1d1f; }
    .text-lg { font-size: 36px; color: #6e6e73; }
  </style>
</head>
<body>
  <div id="s7" data-composition-id="s7" data-start="0" data-duration="7" data-width="1920" data-height="1080">
    <span style="font-size:96px;color:#0071e3;">🛒</span>
    <h1 class="title-xl">ProyectoFinalLP2</h1>
    <p class="text-lg" style="color:#1d1d1f;font-weight:500;">Equipo ProyectoFinalLP2</p>
    <p class="text-lg" style="max-width:900px;text-align:center;">Gestiona tu inventario con control, seguridad y estilo.</p>
  </div>
  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#s7", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0);
    window.__timelines["s7"] = tl;
    tl.seek(0);
  </script>
</body>
</html>
